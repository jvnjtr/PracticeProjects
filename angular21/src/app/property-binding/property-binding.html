<p>property-binding works!</p>
<h2>✔ Property Binding (used for dynamic values)</h2>
<p>Used for:</p>
<ul>
  <li>src</li>
  <li>value</li>
  <li>disabled</li>
  <li>style</li>
  <li>class</li>
</ul>
<h2>✔ Attribute Binding (rare cases)</h2>
<p>Used for:</p>
<ul>
  <li>colspan</li>
  <li>aria-*</li>
  <li>data-* (sometimes)</li>
</ul>
<img [src]="imageVal"  [class]="myClass" [alt]="myimage" [style.width.px]="imgWidth"
  [style.height.px]="imgHeight">
