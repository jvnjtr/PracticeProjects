<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            color:#fff;
        }

        .container{
            text-align:center;
            padding:40px;
            max-width:600px;
        }

        h1{
            font-size:120px;
            margin-bottom:10px;
            font-weight:bold;
            text-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        h2{
            font-size:32px;
            margin-bottom:15px;
        }

        p{
            font-size:18px;
            margin-bottom:30px;
            line-height:1.6;
            color:#ddd;
        }

        .btn{
            display:inline-block;
            padding:14px 30px;
            background:#fff;
            color:#2a5298;
            text-decoration:none;
            border-radius:50px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#f1f1f1;
            transform:translateY(-3px);
        }

        .emoji{
            font-size:70px;
            margin-bottom:20px;
        }

        @media(max-width:600px){

            h1{
                font-size:80px;
            }

            h2{
                font-size:24px;
            }

            p{
                font-size:16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="emoji">😕</div>

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for does not exist
            or has been moved.
        </p>

        <a href="/" class="btn">Go Back Home</a>
    </div>

</body>
</html>
